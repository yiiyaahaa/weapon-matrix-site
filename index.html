                initAttributeLists();

                document.getElementById('starFilter').addEventListener('change', filterWeapons);
                document.getElementById('typeFilter').addEventListener('change', filterWeapons);
                document.getElementById('weaponSearch').addEventListener('input', filterWeapons);
                
                // 绑定搜索模式切换
                document.querySelectorAll('input[name="searchMode"]').forEach(radio => {
                    radio.addEventListener('change', toggleSearchMode);
                });
                
                updateStatus(`数据加载完成: ${weapons.length} 件武器, ${locations.length} 个地点`);
                
            } catch (error) {
                console.error('初始化失败:', error);
                updateStatus('数据加载失败，请刷新页面重试');
                showError('数据加载失败: ' + error.message);
            }
        }
        
        function parseWeaponData(text) {
            const weapons = [];
            const lines = text.trim().split('\n');
            
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (!trimmedLine) continue;
                
                let weaponName, attributesStr;
                
                if (trimmedLine.includes('：')) {
                    [weaponName, attributesStr] = trimmedLine.split('：', 2);
                } else if (trimmedLine.includes(':')) {
                    [weaponName, attributesStr] = trimmedLine.split(':', 2);
                } else {
                    continue;
                }
                
                weaponName = weaponName.trim();
                const attrs = attributesStr.split('、').map(a => a.trim());
                
                // 提取星级和类型
                let star = '未知';
                let type = '未知';
                
                if (weaponName.includes('（') && weaponName.includes('）')) {
                    const start = weaponName.indexOf('（');
                    const end = weaponName.indexOf('）');
                    const info = weaponName.substring(start + 1, end);
                    
                    if (info.includes('六星')) star = '六星';
                    else if (info.includes('五星')) star = '五星';
                    else if (info.includes('四星')) star = '四星';
                    else if (info.includes('三星')) star = '三星';
                    
                    if (info.includes('单手剑')) type = '单手剑';
                    else if (info.includes('双手剑')) type = '双手剑';
                    else if (info.includes('长柄武器')) type = '长柄武器';
                    else if (info.includes('手铳')) type = '手铳';
                    else if (info.includes('施术单元')) type = '施术单元';
                }
                
                const weapon = {
                    name: weaponName,
                    base: attrs[0] || '',
                    extra: attrs[1] || '',
                    skill: attrs[2] || '',
                    star: star,
                    type: type
                };
                
                weapons.push(weapon);
            }
            
            return weapons;
        }
        
        function parseLocationData(text) {
            const locations = [];
            const sections = text.trim().split('\n\n');
            
            for (const section of sections) {
                const lines = section.trim().split('\n');
                if (lines.length < 2) continue;
                
                const locationName = lines[0].trim();
                const location = {
                    name: locationName,
                    base: [],
                    extra: [],
                    skill: []
                };
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    let attrType, attrsStr;
                    
                    if (line.includes('：')) {
                        [attrType, attrsStr] = line.split('：', 2);
                    } else if (line.includes(':')) {
                        [attrType, attrsStr] = line.split(':', 2);
                    } else {
                        continue;
                    }
                    
                    attrType = attrType.trim();
                    const attrs = attrsStr.split('、').map(a => a.trim());
                    
                    if (attrType === '基础属性') location.base = attrs;
                    else if (attrType === '附加属性') location.extra = attrs;
                    else if (attrType === '技能属性') location.skill = attrs;
                }
                
                locations.push(location);
            }
            
            return locations;
        }
        
        function populateWeaponList() {
            const container = document.getElementById('weaponList');
            container.innerHTML = '';
            
            weapons.forEach(weapon => {
                const isSelected = selectedWeapons.has(weapon.name);
                const isLocked = lockedWeapons.has(weapon.name);
                
                const item = document.createElement('div');
                item.className = 'weapon-item';
                item.innerHTML = `
                    <input type="checkbox" ${isSelected ? 'checked' : ''} 
                           onchange="toggleWeapon('${weapon.name.replace(/'/g, "\\'")}')">
                    <span class="lock-btn" onclick="toggleLock('${weapon.name.replace(/'/g, "\\'")}')">
                        ${isLocked ? '🔒' : '🔓'}
                    </span>
                    <span class="weapon-name ${isSelected ? 'selected' : ''} ${isLocked ? 'locked' : ''}"
                          onclick="toggleWeapon('${weapon.name.replace(/'/g, "\\'")}')">
                        ${weapon.name} - 基础:${weapon.base}, 附加:${weapon.extra}, 技能:${weapon.skill}
                    </span>
                `;
                
                container.appendChild(item);
            });
            
            updateCounts();
        }
        
        function toggleWeapon(weaponName) {
            if (selectedWeapons.has(weaponName)) {
                selectedWeapons.delete(weaponName);
            } else {
                selectedWeapons.add(weaponName);
            }
            
            populateWeaponList();
        }
        
        function toggleLock(weaponName) {
            if (lockedWeapons.has(weaponName)) {
                lockedWeapons.delete(weaponName);
            } else {
                lockedWeapons.add(weaponName);
            }
            
            populateWeaponList();
        }
        
        function filterWeapons() {
            const starFilter = document.getElementById('starFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const searchText = document.getElementById('weaponSearch').value.toLowerCase();
            
            const items = document.querySelectorAll('.weapon-item');
            let visibleCount = 0;
            
            items.forEach(item => {
                const weaponName = item.querySelector('.weapon-name').textContent;
                const weapon = weapons.find(w => w.name === weaponName.split(' - ')[0]);
                
                if (!weapon) {
                    item.style.display = 'none';
                    return;
                }
                
                const starMatch = starFilter === '全部' || weapon.star === starFilter;
                const typeMatch = typeFilter === '全部' || weapon.type === typeFilter;
                const searchMatch = !searchText || 
                    weapon.name.toLowerCase().includes(searchText) ||
                    weapon.base.toLowerCase().includes(searchText) ||
                    weapon.extra.toLowerCase().includes(searchText) ||
                    weapon.skill.toLowerCase().includes(searchText);
                
                if (starMatch && typeMatch && searchMatch) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });
            
            updateStatus(`显示 ${visibleCount}/${weapons.length} 件武器`);
        }
        
        function updateCounts() {
            document.getElementById('selectedCount').textContent = selectedWeapons.size;
            document.getElementById('lockedCount').textContent = lockedWeapons.size;
        }
        
        function deselectAll() {
            selectedWeapons.clear();
            populateWeaponList();
            updateStatus('已清除所有选择');
        }
        
        function clearAllLocks() {
            lockedWeapons.clear();
            populateWeaponList();
            updateStatus('已清除所有锁定');
        }
        
        function initAttributeLists() {
            const baseAttrs = new Set();
            const extraAttrs = new Set();
            const skillAttrs = new Set();
            
            // 收集所有属性
            weapons.forEach(weapon => {
                if (weapon.base) baseAttrs.add(weapon.base);
                if (weapon.extra) extraAttrs.add(weapon.extra);
                if (weapon.skill) skillAttrs.add(weapon.skill);
            });
            
            locations.forEach(location => {
                location.base.forEach(attr => baseAttrs.add(attr));
                location.extra.forEach(attr => extraAttrs.add(attr));
                location.skill.forEach(attr => skillAttrs.add(attr));
            });
            
            // 填充选择框
            const baseSelect = document.getElementById('baseSelection');
            const extraSelect = document.getElementById('extraSelection');
            const skillSelect = document.getElementById('skillSelection');
            
            Array.from(baseAttrs).sort().forEach(attr => {
                const option = document.createElement('option');
                option.value = attr;
                option.textContent = attr;
                baseSelect.appendChild(option);
            });
            
            Array.from(extraAttrs).sort().forEach(attr => {
                const option = document.createElement('option');
                option.value = attr;
                option.textContent = attr;
                extraSelect.appendChild(option);
            });
            
            Array.from(skillAttrs).sort().forEach(attr => {
                const option = document.createElement('option');
                option.value = attr;
                option.textContent = attr;
                skillSelect.appendChild(option);
            });
        }
        
        function toggleSearchMode() {
            const mode = document.querySelector('input[name="searchMode"]:checked').value;
            const textSearch = document.getElementById('textSearchContent');
            const selectionSearch = document.getElementById('selectionSearchContent');
            
            if (mode === 'text') {
                textSearch.style.display = 'grid';
                selectionSearch.style.display = 'none';
            } else {
                textSearch.style.display = 'none';
                selectionSearch.style.display = 'grid';
            }
        }
        
        function searchByAttributes() {
            const mode = document.querySelector('input[name="searchMode"]:checked').value;
            const resultArea = document.getElementById('attributeResult');
            
            let baseAttr, extraAttr, skillAttr;
            
            if (mode === 'text') {
                baseAttr = document.getElementById('baseTextSearch').value.trim();
                extraAttr = document.getElementById('extraTextSearch').value.trim();
                skillAttr = document.getElementById('skillTextSearch').value.trim();
            } else {
                baseAttr = document.getElementById('baseSelection').value;
                extraAttr = document.getElementById('extraSelection').value;
                skillAttr = document.getElementById('skillSelection').value;
            }
            
            if (!baseAttr && !extraAttr && !skillAttr) {
                resultArea.innerHTML = '请至少输入一个属性条件！';
                return;
            }
            
            const matches = weapons.filter(weapon => {
                const baseMatch = !baseAttr || (mode === 'text' ? 
                    weapon.base.includes(baseAttr) : weapon.base === baseAttr);
                const extraMatch = !extraAttr || (mode === 'text' ? 
                    weapon.extra.includes(extraAttr) : weapon.extra === extraAttr);
                const skillMatch = !skillAttr || (mode === 'text' ? 
                    weapon.skill.includes(skillAttr) : weapon.skill === skillAttr);
                
                return baseMatch && extraMatch && skillMatch;
            });
            
            resultArea.innerHTML = '';
            
            if (matches.length === 0) {
                resultArea.textContent = `未找到匹配的武器\n\n提示：\n1. ${mode === 'text' ? '可以输入部分属性名称进行模糊搜索' : '请从下拉列表中选择属性'}\n2. 多个属性条件会同时匹配（AND逻辑）\n3. 留空的属性条件不会参与匹配`;
                return;
            }
            
            resultArea.textContent = `找到 ${matches.length} 件匹配的武器:\n\n`;
            
            matches.forEach((weapon, index) => {
                resultArea.textContent += `${index + 1}. ${weapon.name}\n   基础:${weapon.base}, 附加:${weapon.extra}, 技能:${weapon.skill}\n\n`;
            });
            
            updateStatus(`属性搜索完成: 找到 ${matches.length} 件匹配的武器`);
        }
        
        function clearAttributeSearch() {
            document.getElementById('baseTextSearch').value = '';
            document.getElementById('extraTextSearch').value = '';
            document.getElementById('skillTextSearch').value = '';
            document.getElementById('baseSelection').value = '';
            document.getElementById('extraSelection').value = '';
            document.getElementById('skillSelection').value = '';
            document.getElementById('attributeResult').textContent = '搜索结果将显示在这里...';
        }
        
        function startRecommendation() {
            if (selectedWeapons.size === 0) {
                alert('请先选择至少一件武器！');
                return;
            }
            
            updateStatus('正在分析推荐...');
            
            const selectedWeaponNames = Array.from(selectedWeapons);
            const lockedWeaponNames = Array.from(lockedWeapons);
            
            const resultArea = document.getElementById('resultOutput');
            resultArea.innerHTML = '';
            
            // 获取选中的武器对象
            const selectedWeaponObjs = weapons.filter(w => selectedWeapons.has(w.name));
            const lockedWeaponObjs = weapons.filter(w => lockedWeapons.has(w.name));
            
            // 显示选择的武器
            let result = `选择的武器 (${selectedWeapons.size} 件):\n`;
            selectedWeaponNames.forEach((weapon, index) => {
                const lockIcon = lockedWeapons.has(weapon) ? '🔒 ' : '  ';
                result += `  ${index + 1}. ${lockIcon}${weapon}\n`;
            });
            result += '\n';
            
            if (lockedWeapons.size > 0) {
                result += `⚠️ 注意：以下武器已锁定（优先推荐）:\n`;
                lockedWeaponNames.forEach(weapon => {
                    result += `  • ${weapon}\n`;
                });
                result += '\n';
            }
            
            // 分析属性统计
            const allBaseStats = {};
            const allExtraStats = {};
            const allSkillStats = {};
            const lockedBaseStats = {};
            const lockedExtraStats = {};
            const lockedSkillStats = {};
            
            selectedWeaponObjs.forEach(weapon => {
                if (weapon.base) allBaseStats[weapon.base] = (allBaseStats[weapon.base] || 0) + 1;
                if (weapon.extra) allExtraStats[weapon.extra] = (allExtraStats[weapon.extra] || 0) + 1;
                if (weapon.skill) allSkillStats[weapon.skill] = (allSkillStats[weapon.skill] || 0) + 1;
                
                if (lockedWeapons.has(weapon.name)) {
                    if (weapon.base) lockedBaseStats[weapon.base] = (lockedBaseStats[weapon.base] || 0) + 1;
                    if (weapon.extra) lockedExtraStats[weapon.extra] = (lockedExtraStats[weapon.extra] || 0) + 1;
                    if (weapon.skill) lockedSkillStats[weapon.skill] = (lockedSkillStats[weapon.skill] || 0) + 1;
                }
            });
            
            // 计算每个地点的分数
            const locationScores = locations.map(location => {
                let baseScore = 0;
                let lockedScore = 0;
                const matchedProps = { base: new Set(), extra: new Set(), skill: new Set() };
                
                selectedWeaponObjs.forEach(weapon => {
                    if (location.base.includes(weapon.base)) {
                        baseScore += 3;
                        matchedProps.base.add(weapon.base);
                        if (lockedWeapons.has(weapon.name)) lockedScore += 3;
                    }
                    if (location.extra.includes(weapon.extra)) {
                        baseScore += 2;
                        matchedProps.extra.add(weapon.extra);
                        if (lockedWeapons.has(weapon.name)) lockedScore += 2;
                    }
                    if (location.skill.includes(weapon.skill)) {
                        baseScore += 2;
                        matchedProps.skill.add(weapon.skill);
                        if (lockedWeapons.has(weapon.name)) lockedScore += 2;
                    }
                });
                
                const totalScore = baseScore + lockedScore;
                const coverage = (matchedProps.base.size + matchedProps.extra.size + matchedProps.skill.size) / 
                                (selectedWeapons.size * 3) || 0;
                
                return {
                    location,
                    score: totalScore,
                    baseScore,
                    lockedScore,
                    matchedProps,
                    coverage
                };
            });
            
            // 排序
            locationScores.sort((a, b) => b.score - a.score);
            
            result += '✨ 智能分析建议 ✨\n';
            result += '='.repeat(60) + '\n\n';
            
            if (lockedWeapons.size > 0) {
                result += '🎯 优先级设置\n';
                result += '-'.repeat(50) + '\n';
                result += `  • 已锁定 ${lockedWeapons.size} 件武器\n`;
                result += '  • 推荐算法会优先考虑锁定武器的属性\n';
                result += '  • 锁定武器的属性匹配分数会加倍计算\n';
                result += '-'.repeat(50) + '\n\n';
            }
            
            if (locationScores.length > 0) {
                const best = locationScores[0];
                
                result += '🎯 核心推荐\n';
                result += '-'.repeat(55) + '\n\n';
                result += '📍 刷取地点：';
                result += `<span class="result-highlight">${best.location.name}</span>\n\n`;
                
                // 推荐预刻写属性
                const recommendedBase = recommendBaseAttributes(allBaseStats, lockedBaseStats, best.location.base);
                const recommendedExtraSkill = recommendExtraSkillAttributes(
                    allExtraStats, allSkillStats, 
                    lockedExtraStats, lockedSkillStats,
                    best.location.extra, best.location.skill
                );
                
                result += '📋 预刻写方案：\n';
                result += '   基础属性（选3条）：';
                result += `<span class="result-highlight">${recommendedBase.join(', ')}</span>\n`;
                
                if (recommendedExtraSkill) {
                    result += `   ${recommendedExtraSkill.type}（选1条）：`;
                    result += `<span class="result-highlight">${recommendedExtraSkill.value}</span>\n`;
                }
                
                result += '\n📊 关键数据：\n';
                result += `   总评分：${best.score}分\n`;
                if (best.lockedScore > 0) {
                    result += `   其中锁定武器贡献：${best.lockedScore}分\n`;
                }
                result += `   属性覆盖率：${(best.coverage * 100).toFixed(0)}%\n\n`;
                
                result += '='.repeat(60) + '\n\n';
                
                // 详细地点推荐
                result += '📍 详细地点推荐（Top 3）\n';
                result += '='.repeat(60) + '\n\n';
                
                locationScores.slice(0, 3).forEach((item, index) => {
                    result += `${index + 1}. ${item.location.name}\n`;
                    result += `   综合评分: ${item.score}分`;
                    if (item.lockedScore > 0) {
                        result += ` (锁定武器贡献: ${item.lockedScore}分)`;
                    }
                    result += ` | 属性覆盖率: ${(item.coverage * 100).toFixed(1)}%\n\n`;
                });
            }
            
            resultArea.innerHTML = result.replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
            updateStatus('推荐分析完成');
        }
        
        function recommendBaseAttributes(allStats, lockedStats, availableBase) {
            const recommended = new Set();
            
            // 优先考虑锁定武器的属性
            const lockedEntries = Object.entries(lockedStats)
                .filter(([attr]) => availableBase.includes(attr))
                .sort((a, b) => b[1] - a[1]);
            
            for (const [attr] of lockedEntries) {
                if (recommended.size >= 3) break;
                recommended.add(attr);
            }
            
            // 补充所有武器的属性
            if (recommended.size < 3) {
                const allEntries = Object.entries(allStats)
                    .filter(([attr]) => availableBase.includes(attr) && !recommended.has(attr))
                    .sort((a, b) => b[1] - a[1]);
                
                for (const [attr] of allEntries) {
                    if (recommended.size >= 3) break;
                    recommended.add(attr);
                }
            }
            
            // 如果还不够，从可用属性中补充
            if (recommended.size < 3) {
                for (const attr of availableBase) {
                    if (recommended.size >= 3) break;
                    if (!recommended.has(attr)) {
                        recommended.add(attr);
                    }
                }
            }
            
            return Array.from(recommended);
        }
        
        function recommendExtraSkillAttributes(allExtra, allSkill, lockedExtra, lockedSkill, availableExtra, availableSkill) {
            // 优先锁定武器的属性
            const lockedExtraEntries = Object.entries(lockedExtra)
                .filter(([attr]) => availableExtra.includes(attr));
            const lockedSkillEntries = Object.entries(lockedSkill)
                .filter(([attr]) => availableSkill.includes(attr));
            
            if (lockedExtraEntries.length > 0 || lockedSkillEntries.length > 0) {
                const bestLockedExtra = lockedExtraEntries.sort((a, b) => b[1] - a[1])[0];
                const bestLockedSkill = lockedSkillEntries.sort((a, b) => b[1] - a[1])[0];
                
                if (bestLockedSkill && bestLockedExtra) {
                    if (bestLockedSkill[1] >= bestLockedExtra[1]) {
                        return { type: '技能属性', value: bestLockedSkill[0] };
                    } else {
                        return { type: '附加属性', value: bestLockedExtra[0] };
                    }
                } else if (bestLockedSkill) {
                    return { type: '技能属性', value: bestLockedSkill[0] };
                } else if (bestLockedExtra) {
                    return { type: '附加属性', value: bestLockedExtra[0] };
                }
            }
            
            // 如果没有锁定武器的属性，使用所有武器的属性
            const allExtraEntries = Object.entries(allExtra)
                .filter(([attr]) => availableExtra.includes(attr));
            const allSkillEntries = Object.entries(allSkill)
                .filter(([attr]) => availableSkill.includes(attr));
            
            const bestAllExtra = allExtraEntries.sort((a, b) => b[1] - a[1])[0];
            const bestAllSkill = allSkillEntries.sort((a, b) => b[1] - a[1])[0];
            
            if (bestAllSkill && bestAllExtra) {
                if (bestAllSkill[1] >= bestAllExtra[1]) {
                    return { type: '技能属性', value: bestAllSkill[0] };
                } else {
                    return { type: '附加属性', value: bestAllExtra[0] };
                }
            } else if (bestAllSkill) {
                return { type: '技能属性', value: bestAllSkill[0] };
            } else if (bestAllExtra) {
                return { type: '附加属性', value: bestAllExtra[0] };
            }
            
            // 如果没有匹配的属性，从可用属性中选择
            if (availableExtra.length > 0) {
                return { type: '附加属性', value: availableExtra[0] };
            } else if (availableSkill.length > 0) {
                return { type: '技能属性', value: availableSkill[0] };
            }
            
            return null;
        }
        
        function clearResults() {
            document.getElementById('resultOutput').innerHTML = 
                '🌟 欢迎使用武器基质刷取推荐系统！\n\n使用方法：\n1. 在左侧选择您想要刷取基质的武器\n2. 可以使用筛选功能快速找到武器\n3. 可以点击🔒图标锁定优先级武器\n4. 点击"开始推荐"获取刷取建议\n\n系统将根据您选择的武器：\n• 推荐最佳刷取地点\n• 提供预刻写属性建议\n• 分析属性覆盖率\n• 考虑锁定武器的优先级';
        }
        
        function updateStatus(message) {
            document.getElementById('statusMessage').textContent = message;
        }
        
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.main-content'));
            
            setTimeout(() => {
                if (errorDiv.parentNode) {
                    errorDiv.parentNode.removeChild(errorDiv);
                }
            }, 5000);
        }
        
        function switchTab(tabId) {
            // 隐藏所有选项卡内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 移除所有选项卡按钮的活动状态
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // 显示选中的选项卡内容
            document.getElementById(tabId).classList.add('active');
            
            // 设置选中的选项卡按钮为活动状态
            event.target.classList.add('active');
        }
        
        // 初始化应用
        window.onload = init;
    </script>
</body>
