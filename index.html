        // 初始化武器列表
        function initWeaponList() {
            renderWeaponList();

            // 绑定搜索事件
            document.getElementById('weapon-search').addEventListener('input', filterWeapons);
            document.getElementById('star-filter').addEventListener('change', filterWeapons);
            document.getElementById('type-filter').addEventListener('change', filterWeapons);
        }
        
        // 渲染武器列表
        function renderWeaponList() {
            const container = document.getElementById('weapon-list');
            container.innerHTML = '';
            
            filteredWeapons.forEach(weapon => {
                const div = document.createElement('div');
                const isSelected = selectedWeapons.has(weapon.name);
                const isLocked = lockedWeapons.has(weapon.name);
                
                div.className = 'weapon-item';
                if (isSelected) div.classList.add('selected');
                if (isLocked) div.classList.add('locked');
                
                const lockIcon = isLocked ? '🔒 ' : '';
                div.innerHTML = `
                    ${lockIcon}<strong>${weapon.name}</strong><br>
                    <small>基础: ${weapon.base} | 附加: ${weapon.extra} | 技能: ${weapon.skill}</small>
                `;
                
                // 点击选择/取消选择
                div.addEventListener('click', () => {
                    if (isSelected) {
                        selectedWeapons.delete(weapon.name);
                    } else {
                        selectedWeapons.add(weapon.name);
                    }
                    renderWeaponList();
                    updateCounters();
                });
                
                // 双击锁定/解锁
                div.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    if (isLocked) {
                        lockedWeapons.delete(weapon.name);
                    } else {
                        lockedWeapons.add(weapon.name);
                        // 锁定同时也会选择
                        selectedWeapons.add(weapon.name);
                    }
                    renderWeaponList();
                    updateCounters();
                });
                
                container.appendChild(div);
            });
        }
        
        // 筛选武器
        function filterWeapons() {

            const typeFilter = document.getElementById('type-filter').value;
            
            filteredWeapons = weaponData.filter(weapon => {
                // 搜索词匹配
                if (searchTerm && !weapon.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                
                // 星级筛选
                if (starFilter !== 'all' && weapon.star !== starFilter) {
                    return false;
                }
                
                // 类型筛选
                if (typeFilter !== 'all' && weapon.type !== typeFilter) {
                    return false;
                }
                
                return true;
            });
            
            renderWeaponList();
        }
        
        // 更新计数器
        function updateCounters() {

            document.getElementById('locked-count').textContent = lockedWeapons.size;

        // 计算推荐
        function calculateRecommendations() {
            if (selectedWeapons.size === 0) {
                showMessage('请先选择至少一件武器！', 'error');
                return;
            }
            
            // 获取选中的武器数据
            const selectedWeaponData = weaponData.filter(w => selectedWeapons.has(w.name));
            
            // 计算每个地点的分数
            const locationScores = [];
            
            for (const [locationName, locationAttrs] of Object.entries(locationData)) {
                let score = 0;
                let matchedBase = new Set();
                let matchedExtra = new Set();
                let matchedSkill = new Set();
                
                // 计算基础分数
                selectedWeaponData.forEach(weapon => {
                    // 基础属性匹配
                    if (locationAttrs.base.includes(weapon.base)) {
                        score += 3;
                        matchedBase.add(weapon.base);
                    }
                    
                    // 附加属性匹配
                    if (locationAttrs.extra.includes(weapon.extra)) {
                        score += 2;
                        matchedExtra.add(weapon.extra);
                    }
                    
                    // 技能属性匹配
                    if (locationAttrs.skill.includes(weapon.skill)) {
                        score += 2;
                        matchedSkill.add(weapon.skill);
                    }
                });
                
                // 锁定武器额外加分
                const lockedWeaponData = selectedWeaponData.filter(w => lockedWeapons.has(w.name));
                if (lockedWeaponData.length > 0) {
                    let lockedScore = 0;
                    lockedWeaponData.forEach(weapon => {
                        if (locationAttrs.base.includes(weapon.base)) lockedScore += 6; // 加倍
                        if (locationAttrs.extra.includes(weapon.extra)) lockedScore += 4;
                        if (locationAttrs.skill.includes(weapon.skill)) lockedScore += 4;
                    });
                    score += lockedScore;
                }
                
                locationScores.push({
                    name: locationName,
                    score: score,
                    matchedBase: Array.from(matchedBase),
                    matchedExtra: Array.from(matchedExtra),
                    matchedSkill: Array.from(matchedSkill)
                });
            }
            
            // 按分数排序
            locationScores.sort((a, b) => b.score - a.score);
            
            // 显示结果
            displayResults(locationScores, selectedWeaponData);
        }

                const engravingRecommendation = generateEngravingRecommendation(weaponData, locationAttrs);
                
                html += `
                        <div class="engraving-recommendation">
                            <strong>🎯 预刻写方案推荐：</strong>
                            <p>基础属性（选3条）：<span class="highlight">${engravingRecommendation.base.join(', ')}</span></p>
                            <p>${engravingRecommendation.type}（选1条）：<span class="highlight">${engravingRecommendation.attribute}</span></p>
                        </div>
                    </div>
                `;
            }
            
            // 显示所有武器的属性统计
            html += `<h3>📈 属性统计</h3>`;
            
            const baseStats = {};
            const extraStats = {};
            const skillStats = {};
            
            weaponData.forEach(weapon => {
                baseStats[weapon.base] = (baseStats[weapon.base] || 0) + 1;
                extraStats[weapon.extra] = (extraStats[weapon.extra] || 0) + 1;
                skillStats[weapon.skill] = (skillStats[weapon.skill] || 0) + 1;
            });
            
            html += `<p><strong>基础属性分布：</strong><br>`;
            for (const [attr, count] of Object.entries(baseStats)) {
                const percentage = ((count / weaponData.length) * 100).toFixed(0);
                html += `${attr}: ${count}次 (${percentage}%) | `;
            }
            
            html += `</p><p><strong>技能属性分布：</strong><br>`;
            for (const [attr, count] of Object.entries(skillStats)) {
                const percentage = ((count / weaponData.length) * 100).toFixed(0);
                html += `${attr}: ${count}次 (${percentage}%) | `;
            }
            
            resultArea.innerHTML = html;
        }
        
        // 生成预刻写推荐
        function generateEngravingRecommendation(weaponData, locationAttrs) {
            // 统计属性出现频率
            const baseStats = {};
            const extraStats = {};
            const skillStats = {};
            
            weaponData.forEach(weapon => {
                // 基础属性统计
                if (locationAttrs.base.includes(weapon.base)) {
                    baseStats[weapon.base] = (baseStats[weapon.base] || 0) + 1;
                }
                
                // 附加属性统计
                if (locationAttrs.extra.includes(weapon.extra)) {
                    extraStats[weapon.extra] = (extraStats[weapon.extra] || 0) + 1;
                }
                
                // 技能属性统计
                if (locationAttrs.skill.includes(weapon.skill)) {
                    skillStats[weapon.skill] = (skillStats[weapon.skill] || 0) + 1;
                }
            });
            
            // 推荐基础属性（取出现频率最高的3个）
            const recommendedBase = Object.entries(baseStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(item => item[0]);
            
            // 如果不够3个，从地点可用属性中补充
            if (recommendedBase.length < 3) {
                const remainingAttrs = locationAttrs.base.filter(attr => !recommendedBase.includes(attr));
                for (const attr of remainingAttrs) {
                    if (recommendedBase.length >= 3) break;
                    recommendedBase.push(attr);
                }
            }
            
            // 推荐附加/技能属性（取出现频率最高的）
            let recommendedAttr = '';
            let attrType = '';
            
            const bestExtra = Object.entries(extraStats).sort((a, b) => b[1] - a[1])[0];
            const bestSkill = Object.entries(skillStats).sort((a, b) => b[1] - a[1])[0];
            
            if (bestSkill && bestExtra) {
                // 技能属性出现频率≥附加属性时，优先技能属性
                if (bestSkill[1] >= bestExtra[1]) {
                    recommendedAttr = bestSkill[0];
                    attrType = '技能属性';
                } else {
                    recommendedAttr = bestExtra[0];
                    attrType = '附加属性';
                }
            } else if (bestSkill) {
                recommendedAttr = bestSkill[0];
                attrType = '技能属性';
            } else if (bestExtra) {
                recommendedAttr = bestExtra[0];
                attrType = '附加属性';
            } else {
                // 没有匹配的属性，从可用属性中任选一个
                if (locationAttrs.extra.length > 0) {
                    recommendedAttr = locationAttrs.extra[0];
                    attrType = '附加属性';
                } else if (locationAttrs.skill.length > 0) {
                    recommendedAttr = locationAttrs.skill[0];
                    attrType = '技能属性';
                }
            }
            
            return {
                base: recommendedBase,
                attribute: recommendedAttr,
                type: attrType
            };
        }
        
        // 显示消息
        function showMessage(message, type = 'info') {
            const resultArea = document.getElementById('result-area');
            const color = type === 'error' ? '#dc3545' : '#17a2b8';
            resultArea.innerHTML = `<p style="color: ${color}; font-weight: bold;">${message}</p>`;
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initWeaponList);
    </script>
</body>
</html>
